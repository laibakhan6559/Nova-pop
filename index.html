<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140a24" />
    <meta name="description" content="Rune Pop - an elemental bubble shooter. Fire, Water, Earth, Lightning, Shadow and Spirit runes, 20 levels, meteors, prisms, storms, frozen and cursed stone orbs. Free on any device." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Rune Pop - Elemental Bubble Shooter</title>
  </head>
  <body data-world="0">
    <div id="app">
      <div class="orbs" id="orbs" aria-hidden="true"></div>

      <!-- HOME -->
      <section id="home" class="screen active">
        <div class="home-inner">
          <div class="logo">
            <span class="logo-top">RUNE</span>
            <span class="logo-bot">POP</span>
            <small>ELEMENTAL SHOOTER</small>
          </div>
          <div class="home-menu">
            <button id="btn-play" class="btn big primary">Play</button>
            <button id="btn-levels" class="btn big">Levels</button>
            <div class="row">
              <button id="btn-help" class="btn">How to play</button>
              <button id="btn-sound" class="btn icon" aria-label="Toggle sound">🔊</button>
            </div>
          </div>
          <p class="made">20 levels &middot; 4 worlds &middot; 7 special orbs</p>
        </div>
      </section>

      <!-- LEVEL SELECT -->
      <section id="levels" class="screen">
        <header class="topbar">
          <button class="btn icon" id="lv-back" aria-label="Back">&larr;</button>
          <h2>Select level</h2>
          <span class="total" id="stars-total">0/60 &#9733;</span>
        </header>
        <div id="level-grid" class="level-wrap"></div>
      </section>

      <!-- GAME -->
      <section id="game" class="screen">
        <header class="hud">
          <button id="g-pause" class="btn icon" aria-label="Pause">&#9776;</button>
          <div class="hud-mid">
            <div><small>LEVEL</small><b id="h-level">1</b></div>
            <div><small>SCORE</small><b id="h-score">0</b></div>
            <div><small>SHOTS</small><b id="h-shots">0</b></div>
          </div>
          <button id="g-sound" class="btn icon" aria-label="Toggle sound">🔊</button>
        </header>
        <main id="stage" class="stage">
          <canvas id="cv" aria-label="Bubble shooter game board"></canvas>
          <div id="toast" class="toast"></div>
        </main>
        <footer class="tray" id="tray">
          <button class="pw" data-pw="bomb" title="Meteor - smashes a big area"><canvas width="88" height="88"></canvas><i>0</i><span>Meteor</span></button>
          <button class="pw" data-pw="rainbow" title="Rainbow - becomes the best colour"><canvas width="88" height="88"></canvas><i>0</i><span>Prism</span></button>
          <button class="pw" data-pw="lightning" title="Lightning - clears a whole row"><canvas width="88" height="88"></canvas><i>0</i><span>Storm</span></button>
          <button class="pw" id="pw-hint" title="Hint - aims the best shot"><b class="emoji">&#128161;</b><i>3</i><span>Hint</span></button>
          <button class="pw" id="pw-swap" title="Swap current and next bubble"><b class="emoji">&#128260;</b><span>Swap</span></button>
        </footer>
      </section>

      <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="card" id="modal-card"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
